services:
  ros2_jazzy:
    build: 
      context: .
      # target: base  # <--- THIS IS FOR ONLY BASE
      target: desktop  # <--- THIS IS FOR DESKTOP
      args:
        # This is your single point of control for Jazzy vs Kilted
        - ROS_DISTRO=${ROS_DISTRO:-jazzy}
    container_name: ${ROS_DISTRO:-jazzy}_dev
    network_mode: host
    ipc: host
    runtime: nvidia # Tells Docker to use the NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      # Force ROS 2 logging engines to maintain full color output inside the container
      - RCUTILS_COLORIZED_OUTPUT=1
      # Pass the authentication file path
      - XAUTHORITY=/root/.Xauthority

    volumes:
      # Use ../ to go up one level from the 'docker' folder to 'ros2_ws'
      - ../ros2_ws/:/root/ros2_ws/
      # The Bridge for GUI data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Pass the Xauth file directly so NVIDIA drivers can validate the display link
      - ~/.Xauthority:/root/.Xauthority:ro
      # Add this to allow access to the direct rendering manager
      - /dev/dri:/dev/dri:rw

    stdin_open: true 
    tty: true        
    privileged: true 
    working_dir: /root/ros2_ws